{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAssist · Central B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root,
  html[data-theme="dark"] {
    --bg: #0F1419;
    --bg-glow-1: rgba(242,110,36,0.08);
    --bg-glow-2: rgba(242,110,36,0.05);
    --panel: #161D25;
    --panel-alt: #1E2730;
    --border: #2A343F;
    --accent: #F26E24;
    --accent-dim: #C9551A;
    --accent-ink: #17110B;
    --text: #E7EBEF;
    --text-muted: #8B98A5;
    --matched: #4ADE80;
    --unmatched: #E2B93B;
    --scrollbar: #2A343F;
  }

  html[data-theme="light"] {
    --bg: #F2EFE9;
    --bg-glow-1: rgba(242,110,36,0.10);
    --bg-glow-2: rgba(242,110,36,0.06);
    --panel: #FFFFFF;
    --panel-alt: #F5F3EE;
    --border: #E3DED3;
    --accent: #F26E24;
    --accent-dim: #D9611D;
    --accent-ink: #FFFFFF;
    --text: #221D16;
    --text-muted: #7A7264;
    --matched: #15803D;
    --unmatched: #A15C07;
    --scrollbar: #E3DED3;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body { overflow: hidden; }

  /* ---- Full-page app shell ---- */
  .app {
    width: 100vw;
    height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, var(--bg-glow-1), transparent 40%),
      radial-gradient(circle at 85% 100%, var(--bg-glow-2), transparent 45%);
    display: flex;
    flex-direction: column;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  /* ---- Header (spans full page width) ---- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(127,127,127,0.04), transparent);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .header-right {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .jazz-logo {
    height: 100px;
    width: auto;
    display: block;
  }

  .theme-toggle {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .theme-toggle svg { width: 18px; height: 18px; }
  .theme-toggle .icon-moon { display: none; }
  html[data-theme="light"] .theme-toggle .icon-sun { display: none; }
  html[data-theme="light"] .theme-toggle .icon-moon { display: block; }

  .signal-mark {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 20px;
    flex-shrink: 0;
  }

  .signal-mark .bar {
    width: 4px;
    background: var(--accent);
    border-radius: 2px;
    opacity: 0.35;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .signal-mark .bar:nth-child(1) { height: 6px; }
  .signal-mark .bar:nth-child(2) { height: 10px; }
  .signal-mark .bar:nth-child(3) { height: 15px; }
  .signal-mark .bar:nth-child(4) { height: 20px; }

  .signal-mark.active .bar { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  .signal-mark.active .bar:nth-child(1) { animation-delay: 0s; }
  .signal-mark.active .bar:nth-child(2) { animation-delay: 0.12s; }
  .signal-mark.active .bar:nth-child(3) { animation-delay: 0.24s; }
  .signal-mark.active .bar:nth-child(4) { animation-delay: 0.36s; }

  @keyframes pulse {
    0%, 100% { transform: scaleY(0.55); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  .header-text h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }

  /* ---- Messages (full-bleed background, centered readable column) ---- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 26px 20px;
  }

  .messages-inner {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 8px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .row.user .bubble {
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }

  .row.bot .bubble {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .row.bot .bubble { white-space: pre-line; }

  .bot-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.matched { background: var(--matched); }
  .status-dot.unmatched { background: var(--unmatched); }
  .status-dot.ambiguous { background: var(--accent); }
  .status-dot.greeting { background: var(--accent); }

  .typing .bubble {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 16px;
  }
  .typing .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .greeting-bubble {
    max-width: 88%;
    padding: 16px 18px;
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    font-size: 14.5px;
    line-height: 1.6;
  }
  .greeting-bubble strong { color: var(--text); }
  .greeting-bubble ul {
    margin: 10px 0 0;
    padding-left: 20px;
  }
  .greeting-bubble li {
    margin-bottom: 4px;
    color: var(--text);
  }
  .greeting-bubble .greeting-hint {
    margin-top: 12px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ---- Composer ---- */
  .composer-bar {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 16px 20px;
    flex-shrink: 0;
  }

  .composer {
    display: flex;
    gap: 10px;
    max-width: 820px;
    margin: 0 auto;
  }

  .composer input {
    flex: 1;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .composer input:focus { border-color: var(--accent); }
  .composer input::placeholder { color: var(--text-muted); }

  .composer button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
    font-family: 'Inter', sans-serif;
  }
  .composer button:hover { background: var(--accent-dim); }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  .footer {
    text-align: center;
    padding: 10px 16px 14px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
    background: var(--panel);
    flex-shrink: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .signal-mark.active .bar, .typing .dot { animation: none !important; }
  }

  @media (max-width: 640px) {
    .header { padding: 14px 16px; }
    .jazz-logo { height: 34px; }
    .header-text h1 { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-left">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="signal-mark" id="signalMark">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="header-text">
        <h1>SmartAssist</h1>
      </div>
    </div>
    <div class="header-right">
      <img src="{% static 'images/JW.png' %}" alt="Logo" class="jazz-logo">
      <img src="{% static 'images/Jw.jpeg' %}" alt="Logo" class="jazz-logo">
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="messages-inner" id="messagesInner"></div>
  </div>

  <div class="composer-bar">
    <form class="composer" id="composer">
      <input type="text" id="messageInput" placeholder="Type a question..." autocomplete="off" />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <div class="footer"><b>Developed by Central B Operations Team</div></div>
</div>

<script>
  // ---- Theme handling ---->
  (function initTheme() {
    const stored = localStorage.getItem('faqbot-theme');
    const preferred = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', preferred);
  })();

  document.getElementById('themeToggle').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('faqbot-theme', next);
  });

  // ---- Chat logic ----
  const messagesEl = document.getElementById('messages');
  const messagesInner = document.getElementById('messagesInner');
  const form = document.getElementById('composer');
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const signalMark = document.getElementById('signalMark');

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addGreeting() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `
      <div class="greeting-bubble">
        <strong>Hi! 👋 I'm SmartAssist.</strong>
        Ask me questions related to franchise operations, BVS, and more &mdash; including:
        <ul>
          <li>BVS devices &mdash; issuance, criteria, repair status &amp; TAT</li>
          <li>BMD Portal &mdash; access, tickets, whitelisting/blacklisting</li>
          <li>Franchise onboarding, replacement &amp; agreements</li>
          <li>Credit issuance, limits &amp; clearance timelines</li>
          <li>DFS agent onboarding &mdash; T24, CMS, tagging</li>
          <li>KPIs &mdash; A2A, DO service level, stockouts, EVC retailers, drop size</li>
        </ul>
        <div class="greeting-hint">Type a question below to get started.</div>
      </div>
    `;
    messagesInner.appendChild(row);
  }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    messagesInner.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'row bot typing';
    row.id = 'typingRow';
    row.innerHTML = `<div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    messagesInner.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function addBotMessage(answer, matched, score, ambiguous, greeting) {
    const row = document.createElement('div');
    row.className = 'row bot';
    let statusClass = 'unmatched';
    let statusText = 'no match found';
    if (matched) {
      statusClass = 'matched';
      statusText = `matched &middot; ${score}% confidence`;
    } else if (greeting) {
      statusClass = 'greeting';
      statusText = 'SmartAssist';
    } else if (ambiguous) {
      statusClass = 'ambiguous';
      statusText = 'multiple possible matches';
    }
    row.innerHTML = `
      <div>
        <div class="bubble"></div>
        <div class="bot-meta"><span class="status-dot ${statusClass}"></span><span>${statusText}</span></div>
      </div>
    `;
    row.querySelector('.bubble').textContent = answer;
    messagesInner.appendChild(row);
    scrollToBottom();
  }

  async function sendMessage(text) {
    addUserMessage(text);
    input.value = '';
    sendBtn.disabled = true;
    signalMark.classList.add('active');
    addTypingIndicator();

    try {
      const resp = await fetch('/bot/ask/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await resp.json();
      removeTypingIndicator();
      if (resp.ok) {
        addBotMessage(data.answer, data.matched, data.score, data.ambiguous, data.greeting);
      } else {
        addBotMessage('Something went wrong on the server side.', false, null, false, false);
      }
    } catch (err) {
      removeTypingIndicator();
      addBotMessage('Could not reach the server. Check your connection and try again.', false, null, false, false);
    } finally {
      sendBtn.disabled = false;
      signalMark.classList.remove('active');
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    sendMessage(text);
  });

  addGreeting();
  input.focus();
</script>

</body>
</html>
