<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central B · FAQ Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1419;
    --panel: #161D25;
    --panel-alt: #1E2730;
    --border: #2A343F;
    --accent: #F26E24;
    --accent-dim: #C9551A;
    --text: #E7EBEF;
    --text-muted: #8B98A5;
    --matched: #4ADE80;
    --unmatched: #E2B93B;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(242,110,36,0.07), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(242,110,36,0.05), transparent 45%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 680px;
    height: min(88vh, 780px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.6);
  }

  /* ---- Header ---- */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }

  .signal-mark {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 22px;
    flex-shrink: 0;
  }

  .signal-mark .bar {
    width: 5px;
    background: var(--accent);
    border-radius: 2px;
    opacity: 0.35;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .signal-mark .bar:nth-child(1) { height: 6px; }
  .signal-mark .bar:nth-child(2) { height: 11px; }
  .signal-mark .bar:nth-child(3) { height: 16px; }
  .signal-mark .bar:nth-child(4) { height: 22px; }

  .signal-mark.active .bar { opacity: 1; animation: pulse 1.1s ease-in-out infinite; }
  .signal-mark.active .bar:nth-child(1) { animation-delay: 0s; }
  .signal-mark.active .bar:nth-child(2) { animation-delay: 0.12s; }
  .signal-mark.active .bar:nth-child(3) { animation-delay: 0.24s; }
  .signal-mark.active .bar:nth-child(4) { animation-delay: 0.36s; }

  @keyframes pulse {
    0%, 100% { transform: scaleY(0.55); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  .header-text h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .header-text p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ---- Messages ---- */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .row.user .bubble {
    background: var(--accent);
    color: #17110B;
    font-weight: 500;
    border-bottom-right-radius: 4px;
  }

  .row.bot .bubble {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .bot-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.matched { background: var(--matched); }
  .status-dot.unmatched { background: var(--unmatched); }
  .status-dot.ambiguous { background: var(--accent); }

  .row.bot .bubble { white-space: pre-line; }

  .typing .bubble {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 16px;
  }
  .typing .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    max-width: 360px;
  }
  .empty-state .signal-mark { margin: 0 auto 14px; }
  .empty-state h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    color: var(--text);
    margin: 0 0 6px;
  }
  .empty-state p { font-size: 13px; line-height: 1.6; margin: 0; }

  /* ---- Composer ---- */
  .composer {
    display: flex;
    gap: 10px;
    padding: 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }

  .composer input {
    flex: 1;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .composer input:focus { border-color: var(--accent); }
  .composer input::placeholder { color: var(--text-muted); }

  .composer button {
    background: var(--accent);
    color: #17110B;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
    font-family: 'Inter', sans-serif;
  }
  .composer button:hover { background: var(--accent-dim); }
  .composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    .signal-mark.active .bar, .typing .dot { animation: none !important; }
  }

  @media (max-width: 480px) {
    body { padding: 0; }
    .app { height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="signal-mark" id="signalMark">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
    <div class="header-text">
      <h1>Central B FAQ Assistant</h1>
      <p>BVS &middot; ARM &middot; Stockout &middot; Franchise ops</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="signal-mark active">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <h2>Ask anything from the FAQ doc</h2>
      <p>Try &ldquo;What is a BVS device?&rdquo; or &ldquo;How do I report a stockout?&rdquo;</p>
    </div>
  </div>

  <form class="composer" id="composer">
    <input type="text" id="messageInput" placeholder="Type a question..." autocomplete="off" />
    <button type="submit" id="sendBtn">Send</button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('composer');
  const input = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const signalMark = document.getElementById('signalMark');

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUserMessage(text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'row bot typing';
    row.id = 'typingRow';
    row.innerHTML = `<div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function addBotMessage(answer, matched, score, ambiguous) {
    const row = document.createElement('div');
    row.className = 'row bot';
    let statusClass = 'unmatched';
    let statusText = 'no match found';
    if (matched) {
      statusClass = 'matched';
      statusText = `matched &middot; ${score}% confidence`;
    } else if (ambiguous) {
      statusClass = 'ambiguous';
      statusText = 'multiple possible matches';
    }
    row.innerHTML = `
      <div>
        <div class="bubble"></div>
        <div class="bot-meta"><span class="status-dot ${statusClass}"></span><span>${statusText}</span></div>
      </div>
    `;
    row.querySelector('.bubble').textContent = answer;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  async function sendMessage(text) {
    addUserMessage(text);
    input.value = '';
    sendBtn.disabled = true;
    signalMark.classList.add('active');
    addTypingIndicator();

    try {
      const resp = await fetch('/bot/ask/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await resp.json();
      removeTypingIndicator();
      if (resp.ok) {
        addBotMessage(data.answer, data.matched, data.score, data.ambiguous);
      } else {
        addBotMessage('Something went wrong on the server side.', false, null, false);
      }
    } catch (err) {
      removeTypingIndicator();
      addBotMessage('Could not reach the server. Check your connection and try again.', false, null, false);
    } finally {
      sendBtn.disabled = false;
      signalMark.classList.remove('active');
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    sendMessage(text);
  });

  input.focus();
</script>

</body>
</html>
